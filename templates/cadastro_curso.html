<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Curso</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 480px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #1a1a1a;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .subtitulo {
            font-size: 0.875rem;
            color: #666;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .obrigatorio {
            color: #e24b4a;
            margin-left: 2px;
        }

        input, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: sans-serif;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #888;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .hint {
            font-size: 0.75rem;
            color: #999;
            margin-top: 4px;
        }

        hr {
            border: none;
            border-top: 1px solid #eee;
            margin: 1.5rem 0;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-limpar {
            background: transparent;
            border: 1px solid #ccc;
            color: #555;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 0.875rem;
            cursor: pointer;
        }

        .btn-cadastrar {
            background: #1a1a1a;
            color: #fff;
            border: none;
            padding: 8px 22px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-cadastrar:hover { opacity: 0.85; }
        .btn-limpar:hover { background: #f5f5f5; }

        .sucesso {
            display: none;
            background: #eaf3de;
            border: 1px solid #639922;
            color: #3b6d11;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.875rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <h1>Cadastrar curso</h1>
    <p class="subtitulo">Preencha os dados para adicionar um novo curso.</p>

    <form action="/cursos" method="post" id="cursoForm">
        <div class="form-group">
            <label for="nome">Nome do curso <span class="obrigatorio">*</span></label>
            <input type="text" id="nome" name="nome" placeholder="Ex: Desenvolvimento Web" required>
        </div>

        <div class="form-group">
            <label for="carga_horaria">Carga horária <span class="obrigatorio">*</span></label>
            <input type="number" id="carga_horaria" name="carga_horaria" placeholder="Ex: 40" min="1" required>
            <p class="hint">Informe a carga em horas.</p>
        </div>

        <div class="form-group">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" placeholder="Descreva o conteúdo e objetivos do curso..."></textarea>
        </div>

        <hr>

        <div class="form-actions">
            <button type="button" class="btn-limpar" onclick="document.getElementById('cursoForm').reset()">Limpar</button>
            <button type="submit" class="btn-cadastrar">Cadastrar curso</button>
        </div>
    </form>

    <div class="sucesso" id="sucesso">Curso cadastrado com sucesso!</div>

    <script>
        document.getElementById('cursoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const msg = document.getElementById('sucesso');
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 3000);
        });
    </script>

</body>
</html>
